# Dependabot — Kof4j
# Mantém pom.xml (Maven) e .github/workflows (*-actions) atualizados.
# Alerts em: https://github.com/KofLang/Kof4j/security/dependabot
#
# ATENÇÃO — de onde esta configuração é lida (e o que `target-branch` faz):
#   * O GitHub lê este arquivo da DEFAULT BRANCH (`main`), nunca da branch
#     ativa. Alterá-lo fora de `main` (aqui, em `lab`, os dois blocos já
#     apontam para `lab`) NÃO redireciona nada enquanto a mudança não
#     chegar a `main` pelo processo de release/codeowner
#     (`.github/workflows/pr-base-guard.yml` bloqueia PR de não-codeowner
#     contra `main`). Em `main` os dois blocos ainda apontam para a branch
#     congelada `beta-0.5.0` — corrigir `main` é da rota de release (#674).
#   * `target-branch` redireciona apenas atualizações DE VERSÃO. Atualizações
#     de SEGURANÇA continuam sendo abertas contra a default branch — limitação
#     do GitHub, não configurável aqui.
#   * Ao trocar a branch ativa no futuro, atualizar `target-branch` nos dois
#     blocos junto com a decisão (ver `D-BRANCH-PIPELINE` em
#     docs/development/DECISIONS.md).
#   * O rótulo `dependencies` (nos dois blocos) existe no repositório desde
#     28/09 — a chave `labels` está válida.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "lab"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Sao_Paulo"
    groups:
      maven-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "lab"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Sao_Paulo"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
