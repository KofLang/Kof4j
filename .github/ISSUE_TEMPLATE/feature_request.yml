name: Feature request
description: Propose a new feature or improvement for Kof
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? What are you trying to do today that is hard or impossible?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature. Include example syntax or API if relevant.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this affect?
      multiple: true
      options:
        - Language / syntax
        - Compiler
        - Standard library
        - Tooling (CLI, LSP, debugger)
        - Documentation
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you rejected them.
    validations:
      required: false

  - type: textarea
    id: gap_proof
    attributes:
      label: Proof of the gap (D-KOF-FIRST Gate 5)
      description: |
        What did you try (syntax, idiom, stdlib API, composition) and why is each
        one not enough? Gate definition: `AGENTS.md` §Kof-first — D-KOF-FIRST
        Gate 5. "Language X has this feature" is not a proof of a gap.
    validations:
      required: true

  - type: textarea
    id: external_refs
    attributes:
      label: External references (only after the gap is proved)
      description: |
        Optional, and only meaningful once the gap above is established. Name the
        language/spec/paper and the *principle* that is relevant — not the syntax
        to copy: Kof re-expresses the solution through its own philosophy.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I read `docs/philosophy.md` ("What Kof Is NOT") and the idioms of the area (`training/idioms/`). My proposal is a Kof idiom — not syntax imported from another language or stack (HTML/CSS/`innerHTML` into `kof.ui`, Java/Kotlin idioms, framework layers). I understand such requests are closed with a pointer to the docs, not implemented.
          required: true
