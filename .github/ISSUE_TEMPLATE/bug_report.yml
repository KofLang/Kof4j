name: Bug report
description: Report a bug in the Kof language, compiler, or standard library
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please provide a minimal
        reproduction so we can confirm it without rediscovering the problem.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: dropdown
    id: target
    attributes:
      label: Target
      description: Which backend does this affect?
      multiple: true
      options:
        - JVM
        - Native
        - JS
        - Script / interpreter
        - Unknown / all
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Kof version
      description: Output of `kof --version` (e.g. 0.3.2-beta).
      placeholder: "0.3.2-beta"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: OS and architecture (e.g. macOS 15 arm64, Ubuntu 24.04 x86_64).
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest Kof snippet that triggers the bug.
      render: kof
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command used
      description: The exact command you ran.
      placeholder: "kof run --target=jvm repro.kof"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error output or stack trace.
    validations:
      required: true

  - type: textarea
    id: kof_intent
    attributes:
      label: Kof intent and existing idiom
      description: |
        What is the program trying to express, in Kof's own terms? Which existing
        Kof idiom, syntax or stdlib API covers that intent, and why is it not
        enough? Gates: `AGENTS.md` §Kof-first (`D-KOF-FIRST`).
    validations:
      required: true

  - type: input
    id: contract
    attributes:
      label: Kof contract source
      description: |
        Where does Kof define the expected behavior? A `DECISIONS.md` entry, a
        page under `docs/`, a conformance/golden test, or the parity matrix.
        "Other languages do it this way" is not a contract source.
      placeholder: "docs/language-reference/closures.md §1 (lambda-param)"
    validations:
      required: true

  - type: dropdown
    id: classification
    attributes:
      label: Classification (D-KOF-FIRST Gate 4)
      description: |
        Confirmed/corrected during triage; policy in `AGENTS.md` §External
        behavior. No production patch comes from `Design request`, `Not-valid`
        or `Contract ambiguity`.
      options:
        - Real bug — valid Kof diverges from Kof's own contract
        - Target divergence — same valid Kof, different behavior across targets
        - Real gap — legitimate need with no adequate Kof solution
        - Design request — proposes changing a surface/semantics decision
        - Not-valid — the construct is not Kof and an idiom covers the intent
        - Contract ambiguity — docs/decisions/tests do not settle the behavior
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I reproduced this against the latest build.
          required: true
        - label: The reproducer is valid Kof — I checked `docs/language-reference/` and `training/anti-patterns/fake-idioms.md`, and this is not syntax imported from another language (KOF-first, external-second).
          required: true
        - label: I read `docs/philosophy.md` ("What Kof Is NOT"). This is a deviation from Kof's documented behavior — not a request to import another language/stack's syntax (Java/Kotlin idioms, HTML/CSS into `kof.ui`, framework layers); those are closed with a pointer to the docs, not fixed.
          required: true
