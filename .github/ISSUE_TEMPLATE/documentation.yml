name: Documentation
description: Report a problem with the documentation or request new docs
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Affected page or file
      description: URL or path in the repo (e.g. docs/architecture/compiler-architecture.md).
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Type of issue
      options:
        - Incorrect / outdated information
        - Missing information
        - Unclear explanation
        - Broken link or example
        - New documentation needed
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong or missing?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: How would you fix or improve it?
    validations:
      required: false
