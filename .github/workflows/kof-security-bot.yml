name: kof-security-bot

on:
  push:
    branches: [main, beta-*]
  pull_request:
    branches: [main, beta-*]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6am

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  codeql-security:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: CodeQL Security Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: java
          # security-extended + paths-ignore (src/test) no config espelhado;
          # sem o config, o scan re-gerava os fantasmas dos testes (15/09).
          config-file: .github/codeql/kof4j-security-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Security Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/security"
