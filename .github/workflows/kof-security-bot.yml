name: kof-security-bot

on:
  push:
    branches: [main, lab, testing, prerelease, stable]
  pull_request:
    branches: [main, lab, testing, prerelease, stable]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6am

permissions:
  contents: read

jobs:
  codeql-security:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload do SARIF
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: CodeQL Security Analysis
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java
          # security-extended + paths-ignore (src/test) no config espelhado;
          # sem o config, o scan re-gerava os fantasmas dos testes (15/09).
          config-file: .github/codeql/kof4j-security-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Perform CodeQL Security Analysis
        # #563/§386: paths-ignore no config NAO suprime suite importada por
        # `- uses:` (medido 20/09) — filtro real e o pos-SARIF abaixo.
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/security"
          upload: false
          output: ${{ runner.temp }}/codeql-sarif-security

      - name: Filter src/test out of SARIF (#563)
        run: |
          python3 scripts/codeql-sarif-filter.py --selftest
          python3 scripts/codeql-sarif-filter.py "${{ runner.temp }}/codeql-sarif-security"

      - name: Upload filtered SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif-security
          category: "/security"
