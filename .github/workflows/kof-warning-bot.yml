name: kof-warning-bot

on:
  push:
    branches: [main, lab, testing, prerelease, stable]
  pull_request:
    branches: [main, lab, testing, prerelease, stable]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6am

permissions:
  contents: read

jobs:
  compiler-warnings:
    name: Compiler Warnings
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Compile with -Xlint:all
        run: mvn clean compile -Dmaven.compiler.showWarnings=true -Dmaven.compiler.showDeprecation=true -q 2>&1 | tee warnings.log

      - name: Parse Warnings
        run: |
          if grep -q "warning:" warnings.log; then
            echo "::warning::Compiler warnings detected"
            cat warnings.log
          else
            echo "No compiler warnings"
          fi
