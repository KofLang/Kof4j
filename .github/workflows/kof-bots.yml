name: kof-bots-orchestrator

on:
  push:
    branches: [main, lab, testing, prerelease, stable]
  pull_request:
    branches: [main, lab, testing, prerelease, stable]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6am

permissions:
  contents: read

jobs:
  orchestrate:
    name: Orchestrate Bots
    runs-on: ubuntu-latest
    permissions:
      actions: write # createWorkflowDispatch dos três bots
    timeout-minutes: 10
    # PR de FORK: o GITHUB_TOKEN e read-only (regra da plataforma) e o
    # createWorkflowDispatch morre em 403 — o job inteiro vermelhava por
    # INFRA em todo PR externo. Os bots-children ja rodam no proprio
    # gatilho pull_request; o dispatch extra so faz sentido em push/PR
    # interno/schedule/dispatch. Nao e mascara de falha: o que falhava era
    # o veiculo, nao o veredito.
    # PR INTERNO: context.ref = refs/pull/N/merge, que o endpoint de
    # dispatch rejeita com 422 "No ref found for: refs/pull/N/merge". Em
    # pull_request despachamos a branch da PR (head.ref); em
    # push/schedule/dispatch, context.ref ja e uma branch.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Trigger kof-quality-bot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ref = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.ref
              : context.ref;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'kof-quality-bot.yml',
              ref
            });

      - name: Trigger kof-warning-bot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ref = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.ref
              : context.ref;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'kof-warning-bot.yml',
              ref
            });

      - name: Trigger kof-security-bot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ref = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.ref
              : context.ref;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'kof-security-bot.yml',
              ref
            });

  aggregate-results:
    name: Aggregate Bot Results
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 15
    needs: orchestrate
    if: always()
    steps:
      - name: Aggregate Status
        run: |
          echo "Bot orchestration complete"
          echo "Quality: ${{ needs.orchestrate.result }}"
          echo "Warning: ${{ needs.orchestrate.result }}"
          echo "Security: ${{ needs.orchestrate.result }}"