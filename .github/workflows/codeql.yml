# CodeQL — code scanning + code quality (Kof4j)
# Cobre "Code scanning alerts" e "Code quality findings" da aba Security.
# Alertas em: https://github.com/KofLang/Kof4j/security/code-scanning
name: CodeQL

on:
  push:
    branches: [main, lab, testing, prerelease, stable]
  pull_request:
    branches: [main, lab, testing, prerelease, stable]
  schedule:
    - cron: "0 6 * * 1"
  # Re-scan manual (Actions → CodeQL → Run workflow): atualiza os snapshots
  # de findings sem precisar de push (a UI agrega por análise, com lag).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # upload do SARIF
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Só java: o repo não tem .js rastreado (JS_COUNT=0) e o job
        # javascript falharia com "no code found". Se .js/.ts entrarem
        # no corpus, readicionar 'javascript' aqui.
        language: [java]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25 (Tooling API baseline)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          # security-and-quality + paths-ignore (src/test) no config:
          # harnesses de teste invocam java/gcc/qemu com Strings proprias do
          # teste (relative-path/concatenated-command-line) e trust-all LOCAL
          # (KofWebTlsTest) — nao sao superficie de producao. Ver o config.
          # #563/§386: o ignore NAO pega em suite importada (lição #941/#942) —
          # o filtro real e o
          # pos-SARIF (scripts/codeql-sarif-filter.py) no step analyze abaixo.
          config-file: .github/codeql/kof4j-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

      - name: Perform CodeQL Analysis
        # #563/§386: paths-ignore no config NAO suprime suite importada por
        # `- uses:` (medido 20/09 — #941/#942 nasceram com config ativo).
        # Mecanismo que vale em qualquer versao: pos-filtrar o SARIF e subir
        # so o resultado (src/main permanece 100% varrido).
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: false
          output: ${{ runner.temp }}/codeql-sarif-${{ matrix.language }}

      - name: Filter src/test out of SARIF (#563)
        run: |
          python3 scripts/codeql-sarif-filter.py --selftest
          python3 scripts/codeql-sarif-filter.py "${{ runner.temp }}/codeql-sarif-${{ matrix.language }}"

      - name: Upload filtered SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif-${{ matrix.language }}
          category: "/language:${{ matrix.language }}"
