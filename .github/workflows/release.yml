name: Release

# A maintainer-dispatched release candidate: the SHA that runs this workflow
# is the exact SHA that gets tested, packaged, and published — no self-bump,
# no second commit, no push back to the repo (D-ARTIFACT-TRUST, queue (b),
# R1). VERSION and CHANGELOG.md are prepared and committed BEFORE the
# dispatch (docs/distribution/release-beta-0.5.0.md, acceptance record); this workflow only
# validates that prepared candidate, tests it, and ships it.
#
# Invariant this workflow enforces: source SHA tested == source SHA
# published. It does NOT yet prove tested artifact bytes == published
# artifact bytes (each platform job still rebuilds) — that is a later slice.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-candidate:
    name: Test + validate candidate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25 (Tooling API baseline)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Test + package (gate; golden/integration scripts need the CLI jar)
        if: github.ref_name == 'main'
        run: mvn clean package

      - name: Golden tests (jvm + native)
        if: github.ref_name == 'main'
        run: tests/run-golden.sh

      - name: Integration tests (CLI + serve + kof test)
        if: github.ref_name == 'main'
        run: tests/run-integration.sh

      - name: Validate release candidate
        id: candidate
        shell: bash
        run: scripts/validate-release-candidate.sh "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  package-and-release:
    name: Package + Release (${{ matrix.target }})
    needs: validate-candidate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            arch: x86_64
          - os: windows-latest
            target: windows-x86_64
            arch: x86_64
          - os: macos-latest
            target: macos-arm64
            arch: arm64
          - os: macos-15
            target: macos-x86_64
            arch: x86_64
    steps:
      - name: Checkout (release candidate)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Sem `ref` o checkout traria o commit que DISPAROU o workflow por
          # padrão de qualquer forma (aqui e' o próprio candidato) — fixado
          # explicitamente para nunca depender do default implícito.
          ref: ${{ needs.validate-candidate.outputs.candidate_sha }}

      - name: Set up JDK 25 (Tooling API baseline)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify candidate identity
        shell: bash
        run: |
          EXPECTED_SHA="${{ needs.validate-candidate.outputs.candidate_sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_VERSION="${{ needs.validate-candidate.outputs.version }}"
          ACTUAL_VERSION="$(cat VERSION)"

          [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ] || {
            echo "::error::candidate SHA mismatch: expected $EXPECTED_SHA got $ACTUAL_SHA"
            exit 1; }

          [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ] || {
            echo "::error::candidate VERSION mismatch: expected $EXPECTED_VERSION got $ACTUAL_VERSION"
            exit 1; }

      - name: Build
        run: mvn clean package -DskipTests

      - name: Package with embedded JDK
        env:
          KOF_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          scripts/package.sh --jdk || { echo "package --jdk failed, retry without JDK"; scripts/package.sh; }
          ls -la dist/
          echo "dist contents:"; ls -lh dist/; ( tar -tzf dist/kof-$(cat VERSION)-*.tar.gz 2>&1 | grep -E "lib/kof|bin/kof" | head -n 20 || true ); ( unzip -l dist/kof-$(cat VERSION)-*.zip 2>&1 | head -n 20 || true )

      - name: Validate artifact
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          ARCHIVE=$(ls dist/kof-${VERSION}-*.tar.gz dist/kof-${VERSION}-*.zip 2>/dev/null | head -1 || true)
          if [ -z "$ARCHIVE" ]; then
            echo "no archive found in dist/ for kof-${VERSION}" >&2
            ls -la dist/ >&2 || true
            exit 1
          fi
          echo "validating $ARCHIVE"
          rm -rf /tmp/kof-validate && mkdir -p /tmp/kof-validate
          if [[ "$ARCHIVE" == *.zip ]]; then
            cd /tmp/kof-validate && unzip -q "$GITHUB_WORKSPACE/$ARCHIVE"
          else
            cd /tmp/kof-validate && tar -xzf "$GITHUB_WORKSPACE/$ARCHIVE"
          fi
          DIR=$(ls -d /tmp/kof-validate/*/)
          "$DIR/bin/kof" version
          "$DIR/bin/kof" info
          test -x "$DIR/jdk/bin/java" || test -f "$DIR/jdk/bin/java.exe" \
            && echo "embedded JDK present"

      - name: Prepare changelog
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          if [ "${{ github.ref_name }}" = "main" ]; then
            # release final: changelog desde a última release estável (sem +date), não desde a última pre-release
            SINCE=$(git tag -l 'kof-*-linux-x86_64' --sort=-v:refname | grep -v '\+' | head -1 || true)
            if [ -n "$SINCE" ]; then
              scripts/changelog.sh "$SINCE" > /tmp/changelog-section.md
            else
              scripts/changelog.sh > /tmp/changelog-section.md
            fi
          else
            scripts/changelog.sh > /tmp/changelog-section.md
          fi
          { echo "# Kof $VERSION (${{ matrix.target }})"; echo ""; cat /tmp/changelog-section.md; } > release-notes.md
          cat release-notes.md

      - name: Compute release version (pre-release gets date, VERSION file unchanged)
        id: relver
        shell: bash
        run: |
          VER=$(cat VERSION)
          if [ "${{ github.ref_name }}" != "main" ]; then
            DATE=$(date +%Y.%m.%d)
            VER="${VER}+${DATE}"
            echo "pre-release $VER from $(cat VERSION) on ${{ github.ref_name }}"
            for f in dist/kof-$(cat VERSION)-*.tar.gz dist/kof-$(cat VERSION)-*.zip; do
              [ -f "$f" ] || continue
              mv "$f" "${f/kof-$(cat VERSION)-/kof-${VER}-}"
            done
            (cd dist && rm -f SHA256SUMS && sha256sum kof-${VER}-* > SHA256SUMS 2>/dev/null || shasum -a 256 kof-${VER}-* > SHA256SUMS)
            ls -lh dist/
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (${{ matrix.target }})
        uses: softprops/action-gh-release@v3
        with:
          tag_name: kof-${{ steps.relver.outputs.version }}-${{ matrix.target }}
          name: Kof ${{ steps.relver.outputs.version }} (${{ matrix.target }})
          target_commitish: ${{ needs.validate-candidate.outputs.candidate_sha }}
          body_path: release-notes.md
          prerelease: ${{ github.ref_name != 'main' }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            kof-cli/target/kof-cli-*.jar
            kof-cli/target/*-jar-with-dependencies.jar
