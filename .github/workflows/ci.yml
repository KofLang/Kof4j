name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
      - '!main'
      # D-QUALITY-PIPELINE-2609: `lab` is the experimentation stage — NO heavy
      # CI per push. Validation happens at the `lab → testing` promotion.
      - '!lab'

permissions:
  contents: read

jobs:
  # Gates ESTRUTURAIS (contrato de qualidade do repositório). Job PRÓPRIO e
  # independente do funcional: uma violação estrutural (ex.: classe >=600
  # linhas) continua vermelha e bloqueante, mas NÃO impede que o build/teste/
  # golden/integration do MESMO SHA produzam evidência em paralelo — antes o
  # `check_500` vermelho pulava tudo que vinha depois no mesmo job. Nada aqui é
  # advisory: sem `continue-on-error`, sem `if: always()`, sem `needs` frouxo.
  structural-quality:
    name: Structural quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # doc-refs (agent tests) verifies that every SHA cited in docs/development
          # exists as a git object; the default shallow clone (fetch-depth: 1) turns
          # every historical SHA into a false "SHA FANTASMA".
          fetch-depth: 0

      - name: Set up JDK 25 (Tooling API baseline)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify version sources agree
        run: |
          VERSION=$(cat VERSION)
          REV=$(grep -oP '(?<=<revision>)[^<]+' pom.xml)
          if [ "$VERSION" != "$REV" ]; then
            echo "VERSION ($VERSION) and pom.xml revision ($REV) disagree — run scripts/bump-version.sh" >&2
            exit 1
          fi
          scripts/bump-version.sh
          git diff --exit-code

      - name: Gate ≤500 linhas/classe (regra ≤500; §140 — dívidas no baseline não crescem)
        run: scripts/check_500.sh

      - name: Gate R1 fronteira stdlib (D-UNIVERSAL; ledger nao cresce em silencio)
        run: scripts/check_stdlib_boundary.sh --selftest && scripts/check_stdlib_boundary.sh

      - name: Gate automacao de agentes (Onda 1 — gate de despacho, watcher, auto-loop; fakes, sem rede)
        run: bash scripts/tests/run-agent-tests.sh

  # Build + testes + golden + integração. Independente de `structural-quality`
  # (roda em paralelo no MESMO SHA); o SHA só é verde quando TODOS os jobs do
  # workflow estão verdes.
  build-and-test:
    name: Build + Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25 (Tooling API baseline)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Gate instalador (harness offline do scripts/install.sh — PR #457)
        run: bash scripts/tests/install-test.sh

      - name: Install native webview deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Install R engine (X2 motor R — InteropRE2ETest roda de verdade)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-jsonlite
          # o runner pode ter R proprio em /usr/local/bin (PATH na frente do
          # apt) que nao ve a site-library do apt — garante jsonlite visivel
          # ao Rscript ATIVO, instalando na user-library se preciso.
          if ! Rscript -e 'requireNamespace("jsonlite", quietly=TRUE)' 2>/dev/null; then
            Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
          fi
          Rscript --version
      - name: Build native webview shell
        run: scripts/build-webview.sh

      - name: Test + package (the golden/integration scripts need the CLI jar)
        run: mvn clean package

      - name: Golden tests (jvm + native)
        run: tests/run-golden.sh

      - name: Integration tests (CLI + serve)
        run: tests/run-integration.sh

  multiplatform:
    name: kof.io multiplatform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25 (Tooling API baseline)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: kof.io E2E over the real filesystem
        shell: bash
        run: mvn test -pl kof-compiler -am -Dtest=IoE2ETest -Dsurefire.failIfNoSpecifiedTests=false

  # NATIVE002 face (5): CI cross não existia (native-multiarch.md §5 passo 7).
  # As duas suites cross (riscv64/aarch64) têm `assumeToolchain()` que PULA
  # sem toolchain — num runner sem binutils/qemu o job verde seria falso.
  # Este job INSTALA a toolchain, então os 39+39 testes EXECUTAM sob qemu:
  # é a prova real da paridade cross no pipeline, não um skip maquiado.
  cross-native:
    name: Native cross (riscv64 + aarch64 sob qemu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Install cross toolchains + qemu + cross libc
        # libc6-<arch>-cross: link dinâmico sob demanda (link-by-use) —
        # NativeCrossLink detecta /usr/<arch>-linux-gnu e liga sem --sysroot.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-riscv64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-riscv64-cross libc6-arm64-cross \
            qemu-user-static
      - name: riscv64 + aarch64 E2E (executam sob qemu; falha se o codegen regredir)
        run: >
          mvn -B test -pl kof-compiler -am
          -Dtest='NativeRiscv64E2ETest,NativeAarch64E2ETest,NativeCrossDynamicLinkTest,NativeRiscvDtoaTest,NativeRiscvGcListTest,NativeRiscvGcMarkTest,NativeRiscvGcFreeListTest,NativeRiscvGcSweepTest'
          -Dsurefire.failIfNoSpecifiedTests=false
